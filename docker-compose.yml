version: '3.8'

services:
  dashboard:
    image: ghcr.io/l8tenever/dashboard:latest
    pull_policy: always
    container_name: meintag-dashboard
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - USE_GEVENT=true
      - MCP_SERVER_URL=${MCP_SERVER_URL:-}
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN:-}
      - MCP_EVENTS_TOOL=${MCP_EVENTS_TOOL:-list-events}
      - MCP_TASKS_TOOL=${MCP_TASKS_TOOL:-}
      - MCP_TOOL_ARGS=${MCP_TOOL_ARGS:-{}}
      - MCP_TOOL_TIMEOUT=${MCP_TOOL_TIMEOUT:-20}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json
      - GOOGLE_TOKEN_PATH=/app/token.json
    volumes:
      - dashboard-data:/app/data
    # Optional: nur einkommentieren, wenn credentials.json / token.json
    # lokal vorhanden sind (siehe README, Google-Calendar-Integration).
    # volumes:
    #   - ./credentials.json:/app/credentials.json:ro
    #   - ./token.json:/app/token.json

  # Eigener MCP-Server des Dashboards (zweiter Port): hierüber kann eine KI
  # Termine/Hausaufgaben/Todos anlegen, bearbeiten und löschen. Läuft im
  # selben Image, teilt sich die SQLite-Datenbank per Volume mit "dashboard".
  mcp-server:
    image: ghcr.io/l8tenever/dashboard:latest
    pull_policy: always
    container_name: meintag-dashboard-mcp
    restart: unless-stopped
    command: ["python", "mcp_server.py"]
    ports:
      - "5001:5001"
    environment:
      - DASHBOARD_MCP_HOST=0.0.0.0
      - DASHBOARD_MCP_PORT=5001
      - DASHBOARD_MCP_AUTH_TOKEN=${DASHBOARD_MCP_AUTH_TOKEN:?Bitte DASHBOARD_MCP_AUTH_TOKEN in der .env setzen}
    volumes:
      - dashboard-data:/app/data

volumes:
  dashboard-data:
